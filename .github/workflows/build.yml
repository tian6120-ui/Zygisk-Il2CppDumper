name: Build Inkvasion Standalone

on:
  push:
    branches:
      - inkvasion-standalone-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: gradle
      - name: Build Magisk-KSU module
        run: |
          chmod +x ./gradlew
          ./gradlew :module:zipRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Inkvasion_Standalone_AutoUnlock_V1
          path: out/*.zip
          if-no-files-found: error
